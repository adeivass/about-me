<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EVOLVE — Multi-Agent Ecosystem Simulator | ADEIVASS.DEV</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151c2c;
      --border: #232d42;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-danger: #f43f5e;
      --accent-success: #10b981;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.6;
      padding: 2rem 1rem;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .wrapper {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand {
      font-size: 0.8rem;
      letter-spacing: 2px;
      color: var(--accent);
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 0.25rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 800;
      line-height: 1.2;
    }

    .nav-back {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-family: var(--font-mono);
      transition: color 0.2s;
    }
    .nav-back:hover { color: var(--accent); }

    .grid-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    @media (min-width: 768px) {
      .grid-layout {
        grid-template-columns: 320px 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .section-label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .metric-box {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
    }

    .metric-title {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-family: var(--font-mono);
    }

    .metric-value {
      font-size: 1.15rem;
      font-weight: 700;
      font-family: var(--font-mono);
      color: var(--text);
      margin-top: 0.2rem;
    }

    /* Simulation Viewport & Tools */
    .viewport-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .palette {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .tool-btn {
      flex: 1;
      min-width: 70px;
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      transition: all 0.2s;
    }

    .tool-btn:hover { border-color: var(--accent); }

    .tool-btn.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    #grid-container {
      display: grid;
      grid-template-columns: repeat(15, 1fr);
      gap: 2px;
      background: var(--border);
      padding: 2px;
      border-radius: 8px;
      aspect-ratio: 1 / 1;
      width: 100%;
    }

    .cell {
      background: #090d16;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      user-select: none;
      cursor: pointer;
      transition: background 0.15s;
    }

    .cell:hover { background: #1e293b; }

    /* Action Controls & Logging */
    .controls {
      display: flex;
      gap: 0.75rem;
    }

    .btn {
      background: var(--accent);
      color: #000;
      font-weight: 600;
      padding: 0.63rem 1.25rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      transition: opacity 0.2s;
      flex: 1;
    }

    .btn:hover { opacity: 0.9; }

    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-outline:hover {
      border-color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
    }

    .discovery-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .discovery-item {
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .discovery-item.unlocked {
      color: var(--accent-success);
    }

    .log-box {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      background: #090d16;
      border: 1px solid var(--border);
      padding: 0.75rem;
      border-radius: 6px;
      height: 90px;
      overflow-y: auto;
      color: var(--text-muted);
    }

    .log-box .log-event { color: var(--accent); }
  </style>
</head>
<body>

  <div class="wrapper">
    <header>
      <div>
        <div class="brand">ADEIVASS.DEV / LABS</div>
        <h1>Multi-Agent Ecosystem Simulator</h1>
      </div>
      <a href="index.html" class="nav-back">← Return to Homepage</a>
    </header>

    <div class="grid-layout">
      <!-- SYSTEM TELEMETRY SIDEBAR -->
      <div class="card">
        <div class="section-label">System Telemetry</div>

        <div class="metrics-grid">
          <div class="metric-box">
            <div class="metric-title">Date Seed</div>
            <div class="metric-value" id="val-date" style="font-size: 0.85rem;">----</div>
          </div>
          <div class="metric-box">
            <div class="metric-title">Grid Temp</div>
            <div class="metric-value" id="val-temp">--°C</div>
          </div>
          <div class="metric-box">
            <div class="metric-title">Agents</div>
            <div class="metric-value" id="val-pop">0</div>
          </div>
          <div class="metric-box">
            <div class="metric-title">Tick Step</div>
            <div class="metric-value" id="val-gen">1</div>
          </div>
        </div>

        <div>
          <div class="section-label" style="margin-bottom: 0.5rem;">System States</div>
          <ul class="discovery-list" id="discovery-list"></ul>
        </div>

        <div class="controls">
          <button class="btn" id="btn-step">Run Tick Step</button>
          <button class="btn btn-outline" id="btn-share">Share Result</button>
        </div>
      </div>

      <!-- MAIN SIMULATION WORKSPACE -->
      <div class="card">
        <div class="viewport-header">
          <div class="section-label">Grid State Matrix (15x15)</div>
          <div class="section-label" id="rain-status" style="color: var(--accent);">Rain: --</div>
        </div>

        <div>
          <div class="section-label" style="margin-bottom: 0.4rem;">Injection Tools</div>
          <div class="palette">
            <button class="tool-btn active" data-tool="🌱">🌱 Plant</button>
            <button class="tool-btn" data-tool="💧">💧 Water</button>
            <button class="tool-btn" data-tool="🐺">🐺 Predator</button>
            <button class="tool-btn" data-tool="🪨">🪨 Barrier</button>
            <button class="tool-btn" data-tool="CLEAR">🧹 Clear</button>
          </div>
        </div>

        <div id="grid-container"></div>
        
        <div class="log-box" id="log-box"></div>
      </div>
    </div>
  </div>

  <script>
    class SeededPRNG {
      constructor(seed) {
        this.m = 0x80000000;
        this.a = 1103515245;
        this.c = 12345;
        this.state = seed ? seed : Math.floor(Math.random() * (this.m - 1));
      }
      nextFloat() {
        this.state = (this.a * this.state + this.c) % this.m;
        return this.state / (this.m - 1);
      }
      nextInt(min, max) {
        return Math.floor(this.nextFloat() * (max - min + 1)) + min;
      }
    }

    function getStringSeed(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
      }
      return Math.abs(hash);
    }

    const GRID_SIZE = 15;
    const TODAY_STR = new Date().toISOString().split('T')[0];
    const SEED = getStringSeed(TODAY_STR);
    const rng = new SeededPRNG(SEED);

    let activeTool = '🌱';

    const DISCOVERIES = [
      { id: 'photosynthesis', label: 'Photosynthesis', key: '🌱' },
      { id: 'hydration', label: 'Irrigation Pattern', key: '💧' },
      { id: 'herbivore', label: 'Herbivore Cascade', key: '🐛' },
      { id: 'predator', label: 'Apex Predator Control', key: '🐺' },
      { id: 'heat_res', label: 'Thermal Equilibrium', key: '🔥' },
      { id: 'overpopulation', label: 'Grid Saturation (>60%)', key: '💀' }
    ];

    let gameState = {
      lastPlayed: TODAY_STR,
      generation: 1,
      population: 0,
      discoveries: [],
      grid: [] 
    };

    const worldConditions = {
      temp: rng.nextInt(15, 42),
      rain: ['LOW', 'MEDIUM', 'HIGH'][rng.nextInt(0, 2)],
      predatorRisk: rng.nextFloat() > 0.4
    };

    function init() {
      document.getElementById('val-date').innerText = TODAY_STR;
      document.getElementById('val-temp').innerText = `${worldConditions.temp}°C`;
      document.getElementById('rain-status').innerText = `Rainfall: ${worldConditions.rain}`;

      setupPaletteControls();
      loadSavedState();
      
      if (!gameState.grid || gameState.grid.length === 0) {
        setupInitialGrid();
      }

      render();
    }

    function setupPaletteControls() {
      const buttons = document.querySelectorAll('.tool-btn');
      buttons.forEach(btn => {
        btn.addEventListener('click', (e) => {
          buttons.forEach(b => b.classList.remove('active'));
          const target = e.currentTarget;
          target.classList.add('active');
          activeTool = target.getAttribute('data-tool');
        });
      });
    }

    function setupInitialGrid() {
      gameState.grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(null));
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const val = rng.nextFloat();
          if (val < 0.20) gameState.grid[r][c] = '🌱';
          else if (val < 0.26) gameState.grid[r][c] = '🐛';
          else if (val < 0.29 && worldConditions.predatorRisk) gameState.grid[r][c] = '🐺';
        }
      }
    }

    function loadSavedState() {
      const raw = localStorage.getItem('evolve_game_state');
      if (raw) {
        try {
          const parsed = JSON.parse(raw);
          gameState = { ...gameState, ...parsed };
        } catch(e) { console.error("Could not parse saved state."); }
      }
    }

    function saveState() {
      gameState.lastPlayed = TODAY_STR;
      localStorage.setItem('evolve_game_state', JSON.stringify(gameState));
    }

    function handleCellClick(r, c) {
      const newValue = activeTool === 'CLEAR' ? null : activeTool;
      gameState.grid[r][c] = newValue;

      if (newValue === '💧') unlockDiscovery('hydration');
      else if (newValue === '🌱') unlockDiscovery('photosynthesis');
      else if (newValue === '🐺') unlockDiscovery('predator');

      saveState();
      render();
    }

    function runSimulationTick() {
      gameState.generation++;
      const nextGrid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(null));

      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const cell = gameState.grid[r][c];
          const neighbors = getNeighbors(r, c);
          
          if (cell === '🪨') {
            nextGrid[r][c] = '🪨';
          } else if (cell === '💧') {
            nextGrid[r][c] = '💧';
          } else if (cell === '🌱') {
            unlockDiscovery('photosynthesis');
            if (neighbors.includes('🐛')) {
              nextGrid[r][c] = '🐛';
            } else {
              nextGrid[r][c] = '🌱';
              const hasWater = neighbors.includes('💧');
              const spreadChance = hasWater ? 0.35 : (worldConditions.rain === 'HIGH' ? 0.15 : 0.05);
              if (Math.random() < spreadChance) {
                spreadToEmpty(nextGrid, r, c, '🌱');
              }
            }
          } else if (cell === '🐛') {
            unlockDiscovery('herbivore');
            if (neighbors.includes('🐺')) {
              nextGrid[r][c] = '🐺';
            } else if (!neighbors.includes('🌱') && Math.random() < 0.4) {
              nextGrid[r][c] = null;
            } else {
              nextGrid[r][c] = '🐛';
            }
          } else if (cell === '🐺') {
            unlockDiscovery('predator');
            if (!neighbors.includes('🐛') && Math.random() < 0.5) {
              nextGrid[r][c] = null;
            } else {
              nextGrid[r][c] = '🐺';
            }
          } else {
            if (neighbors.includes('💧') && Math.random() < 0.2) {
              nextGrid[r][c] = '🌱';
            } else if (worldConditions.temp > 35 && Math.random() < 0.02) {
              unlockDiscovery('heat_res');
            } else if (neighbors.filter(n => n === '🌱').length >= 2 && Math.random() < 0.2) {
              nextGrid[r][c] = '🌱';
            }
          }
        }
      }

      gameState.grid = nextGrid;
      saveState();
    }

    function getNeighbors(r, c) {
      const neighbors = [];
      const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
      dirs.forEach(([dr, dc]) => {
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE) {
          if (gameState.grid[nr][nc]) neighbors.push(gameState.grid[nr][nc]);
        }
      });
      return neighbors;
    }

    function spreadToEmpty(gridTarget, r, c, entity) {
      const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
      const [dr, dc] = dirs[Math.floor(Math.random() * dirs.length)];
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE) {
        if (!gridTarget[nr][nc]) gridTarget[nr][nc] = entity;
      }
    }

    function unlockDiscovery(id) {
      if (!gameState.discoveries.includes(id)) {
        gameState.discoveries.push(id);
        const item = DISCOVERIES.find(d => d.id === id);
        logMessage(`STATE UNLOCKED: ${item.key} ${item.label}`);
      }
    }

    function render() {
      document.getElementById('val-gen').innerText = gameState.generation;
      const container = document.getElementById('grid-container');
      container.innerHTML = '';
      
      let popCount = 0;
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const div = document.createElement('div');
          div.className = 'cell';
          const entity = gameState.grid[r][c];
          
          if (entity) {
            div.innerText = entity;
            if (entity === '🌱' || entity === '🐛' || entity === '🐺') popCount++;
          }

          div.addEventListener('click', () => handleCellClick(r, c));
          container.appendChild(div);
        }
      }

      if (popCount > (GRID_SIZE * GRID_SIZE) * 0.6) unlockDiscovery('overpopulation');

      gameState.population = popCount;
      document.getElementById('val-pop').innerText = gameState.population;

      const discoveryContainer = document.getElementById('discovery-list');
      discoveryContainer.innerHTML = '';
      DISCOVERIES.forEach(d => {
        const isUnlocked = gameState.discoveries.includes(d.id);
        const li = document.createElement('li');
        li.className = `discovery-item ${isUnlocked ? 'unlocked' : ''}`;
        li.innerHTML = `<span>${isUnlocked ? '[✓]' : '[ ]'}</span> ${isUnlocked ? d.key : '❓'} ${isUnlocked ? d.label : 'Undiscovered State'}`;
        discoveryContainer.appendChild(li);
      });
    }

    function logMessage(msg) {
      const box = document.getElementById('log-box');
      const entry = document.createElement('div');
      entry.innerHTML = `<span class="log-event">[sys-log]</span> ${msg}`;
      box.appendChild(entry);
      box.scrollTop = box.scrollHeight;
    }

    document.getElementById('btn-step').addEventListener('click', () => {
      runSimulationTick();
      render();
    });

    document.getElementById('btn-share').addEventListener('click', () => {
      const score = (gameState.population * 12) + (gameState.generation * 45) + (gameState.discoveries.length * 100);
      const shareText = `EVOLVE #${TODAY_STR.replace(/-/g, '')}\nTicks: ${gameState.generation} | Agents: ${gameState.population}\nDiscovered States: ${gameState.discoveries.length}/${DISCOVERIES.length}\nSystem Score: ${score.toLocaleString()}\n\nSimulate at: ${window.location.origin}/evolve.html`;
      
      navigator.clipboard.writeText(shareText).then(() => {
        alert("Ecosystem status copied to clipboard!\n\n" + shareText);
      });
    });

    init();
  </script>
</body>
</html>
